spring.application.name=svc-catalogo

# Conexion a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${CATALOGO_DB_NAME:catalogo_db}
spring.datasource.username=${CATALOGO_DB_USER}
spring.datasource.password=${CATALOGO_DB_PASSWORD}

# Hibernate valida el esquema, pero no crea ni modifica tablas
spring.jpa.hibernate.ddl-auto=validate

# Flyway administra las migraciones de la base de datos
spring.flyway.enabled=true

# Evitar mantener el contexto de persistencia abierto durante la respuesta web
spring.jpa.open-in-view=false

# Integracion REST con el servicio central de la catedra
catedra.api.base-url=${CATEDRA_API_BASE_URL:}
catedra.api.token=${CATEDRA_API_TOKEN:}