spring.application.name=svc-catalogo

# Conexion a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${CATALOGO_DB_NAME:catalogo_db}
spring.datasource.username=${CATALOGO_DB_USER}
spring.datasource.password=${CATALOGO_DB_PASSWORD}

# Hibernate valida el esquema, pero no crea ni modifica tablas
spring.jpa.hibernate.ddl-auto=validate

# Flyway administra las migraciones de la base de datos
spring.flyway.enabled=true

# Evitar mantener el contexto de persistencia abierto durante la respuesta web
spring.jpa.open-in-view=false

# Integracion REST con el servicio central de la catedra
catedra.api.base-url=${CATEDRA_API_BASE_URL:}
catedra.api.token=${CATEDRA_API_TOKEN:}

# Integracion Redis con el servicio central de la catedra
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=5s
spring.data.redis.connect-timeout=5s

# Integracion Kafka con el servicio central de la catedra
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_GROUP_ID:svc-catalogo-local}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest

# El offset se confirma despues del procesamiento exitoso
spring.kafka.listener.ack-mode=manual_immediate

# No iniciar el consumidor hasta terminar su implementacion
spring.kafka.listener.auto-startup=${KAFKA_LISTENER_AUTO_STARTUP:false}

# Topic de actualizaciones del catalogo
catalogo.kafka.topic=${KAFKA_CATALOGO_TOPIC:catalogo-no-configurado}