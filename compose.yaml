services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CATALOGO_DB_NAME}
      POSTGRES_USER: ${CATALOGO_DB_USER}
      POSTGRES_PASSWORD: ${CATALOGO_DB_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - catalogo_postgres_data:/var/lib/postgresql
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  svc-catalogo:
    build: .
    restart: unless-stopped
    networks:
      - default
      - integracion
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${CATALOGO_DB_NAME}
      CATALOGO_DB_USER: ${CATALOGO_DB_USER}
      CATALOGO_DB_PASSWORD: ${CATALOGO_DB_PASSWORD}
      CATALOGO_JWT_PUBLIC_KEY_LOCATION: file:/run/keys/turnos-public.pem
      CATALOGO_JWT_ISSUER: ${CATALOGO_JWT_ISSUER:-svc-turnos}
      CATALOGO_JWT_AUDIENCE: ${CATALOGO_JWT_AUDIENCE:-svc-catalogo-api}
      CATEDRA_API_BASE_URL: ${CATEDRA_API_BASE_URL:-}
      CATEDRA_API_TOKEN: ${CATEDRA_API_TOKEN:-}
      REDIS_HOST: ${REDIS_HOST:-localhost}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-localhost:9092}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-svc-catalogo-local}
      KAFKA_CATALOGO_TOPIC: ${KAFKA_CATALOGO_TOPIC:-catalogo-no-configurado}
      KAFKA_LISTENER_AUTO_STARTUP: ${KAFKA_LISTENER_AUTO_STARTUP:-false}
      CATALOGO_RECONCILIACIONINICIO_ENABLED: ${CATALOGO_RECONCILIACIONINICIO_ENABLED:-true}
      CATALOGO_RECONCILIACION_PERIODICA_ENABLED: ${CATALOGO_RECONCILIACION_PERIODICA_ENABLED:-false}
      CATALOGO_RECONCILIACION_PERIODICA_INTERVALO_MS: ${CATALOGO_RECONCILIACION_PERIODICA_INTERVALO_MS:-60000}
      CATALOGO_RECONCILIACION_PERIODICA_DEMORA_INICIAL_MS: ${CATALOGO_RECONCILIACION_PERIODICA_DEMORA_INICIAL_MS:-60000}
      KAFKA_CATALOGO_REINTENTO_INTERVALO_MS: ${KAFKA_CATALOGO_REINTENTO_INTERVALO_MS:-2000}
      KAFKA_CATALOGO_REINTENTOS_MAXIMOS: ${KAFKA_CATALOGO_REINTENTOS_MAXIMOS:-3}
    ports:
      - "127.0.0.1:${CATALOGO_HTTP_PORT:-8081}:8080"
    volumes:
      - type: bind
        source: ${CATALOGO_JWT_PUBLIC_KEY_FILE:?Definir la ruta absoluta de la clave publica RSA}
        target: /run/keys/turnos-public.pem
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      # La ruta existe y exige JWT: 401 sin token prueba que responde la cadena HTTP.
      # No certifica vigencia del catalogo ni salud de Redis/Kafka.
      test: ["CMD-SHELL", "test \"$$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 3 http://127.0.0.1:8080/api/catalogo/profesionales)\" = 401"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  catalogo_postgres_data:

networks:
  default: {}
  integracion:
    external: true
    name: backends-integracion
