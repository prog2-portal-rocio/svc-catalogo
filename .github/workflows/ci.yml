
name: CI - Catálogo

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilación, pruebas y análisis
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '25'
          cache: maven

      - name: Compilar, probar y generar cobertura
        run: ./mvnw --batch-mode clean verify

      - name: Analizar con SonarQube Cloud
        if: github.event_name != 'pull_request' || github.base_ref == 'main'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./mvnw --batch-mode sonar:sonar
          -Dsonar.projectKey=prog2-portal-rocio_svc-catalogo
          -Dsonar.host.url=https://sonarcloud.io
